name: Deploy Oferta (diasdemoda-oferta)

on:
  push:
    branches: [main]
    paths:
      - 'oferta/**'
      - '.github/workflows/deploy-oferta.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: oferta

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy no Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
