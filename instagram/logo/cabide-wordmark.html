<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Karla:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body {
    width: 1200px; height: 1300px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Karla', sans-serif;
  }
  .lockup { text-align: center; }
  .hanger { margin-bottom: 26px; }
  .name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 168px;
    letter-spacing: 0.08em;
    color: #2B1A22;
    line-height: 0.95;
  }
  .sub {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: 18px;
    text-transform: uppercase;
    color: #AE567C;
    margin-top: 26px;
    text-indent: 18px;
  }
  .stitch {
    width: 240px; height: 5px; border-radius: 999px;
    background-image: repeating-linear-gradient(90deg, #AE567C 0 14px, transparent 14px 30px);
    margin: 34px auto 0;
  }
</style>
</head>
<body>
  <div class="lockup">
    <!-- cabide -->
    <svg class="hanger" width="320" height="300" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#C26A8C"/>
          <stop offset="1" stop-color="#8C3F63"/>
        </linearGradient>
      </defs>

      <!-- gancho -->
      <path d="M120 16 C120 28 133 33 133 46 C133 56 120 60 120 68"
            fill="none" stroke="#AE567C" stroke-width="15" stroke-linecap="round"/>

      <!-- corpo: triângulo arredondado com ombros suaves -->
      <path d="M120 76
               C88 86, 50 120, 47 166
               Q46 180, 60 180
               L180 180
               Q194 180, 193 166
               C190 120, 152 86, 120 76
               Z" fill="url(#corpo)"/>

      <!-- brilho sutil no ombro esquerdo -->
      <path d="M120 76 C96 84, 66 110, 60 140" fill="none" stroke="#E1ADB1" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    </svg>

    <div class="name">DIAS DE MODA</div>
    <div class="sub">Uniformes</div>
    <div class="stitch"></div>
  </div>
</body>
</html>
