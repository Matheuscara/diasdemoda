<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Karla:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body { width: 1200px; height: 1200px; display: flex; align-items: center; justify-content: center; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#5C4450"/>
      <stop offset="100%" stop-color="#2B1A22"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="60" y="60" width="880" height="880" rx="200" fill="url(#bg)"/>
  <rect x="60" y="60" width="880" height="880" rx="200" fill="none" stroke="#AE567C" stroke-width="8"/>

  <!-- borda costurada interna -->
  <rect x="110" y="110" width="780" height="780" rx="160" fill="none" stroke="#E1ADB1" stroke-width="3" stroke-dasharray="2 26" stroke-linecap="round"/>

  <!-- monograma -->
  <text x="500" y="520" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="340" fill="#AE567C" letter-spacing="8">DM</text>

  <!-- nome -->
  <text x="500" y="650" text-anchor="middle" font-family="'Karla', sans-serif" font-weight="700" font-size="54" letter-spacing="16" fill="#FBF6F4">DIAS DE MODA</text>
  <text x="500" y="726" text-anchor="middle" font-family="'Karla', sans-serif" font-weight="700" font-size="34" letter-spacing="12" fill="#E1ADB1">UNIFORMES</text>

  <!-- estrelas decorativas -->
  <text x="500" y="200" text-anchor="middle" font-size="40" fill="#C9A24B">✦</text>
</svg>
</body>
</html>
