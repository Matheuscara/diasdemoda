<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Karla:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body {
    width: 1500px; height: 1200px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Karla', sans-serif;
  }
  .lockup { display: flex; align-items: center; gap: 56px; }
  .icon { flex: 0 0 auto; }
  .text { }
  .name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 150px;
    letter-spacing: 0.06em;
    color: #2B1A22;
    line-height: 0.95;
  }
  .sub {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 16px;
    text-transform: uppercase;
    color: #AE567C;
    margin-top: 24px;
    text-indent: 16px;
  }
</style>
</head>
<body>
  <div class="lockup">
    <!-- ícone agulha + linha -->
    <svg class="icon" width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <!-- linha (thread) -->
      <path d="M 150 40 C 40 70, 60 180, 150 230 C 240 180, 260 70, 150 40"
            fill="none" stroke="#E1ADB1" stroke-width="10" stroke-linecap="round"/>
      <!-- agulha (needle) -->
      <line x1="150" y1="28" x2="150" y2="252" stroke="#AE567C" stroke-width="16" stroke-linecap="round"/>
      <!-- olho da agulha -->
      <ellipse cx="150" cy="52" rx="6" ry="20" fill="none" stroke="#2B1A22" stroke-width="5"/>
      <!-- ponta -->
      <polygon points="142,252 158,252 150,288" fill="#AE567C"/>
    </svg>
    <div class="text">
      <div class="name">DIAS DE MODA</div>
      <div class="sub">Uniformes</div>
    </div>
  </div>
</body>
</html>
