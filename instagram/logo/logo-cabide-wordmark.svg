    <path d="M120 76 C88 86, 50 120, 47 166 Q46 180, 60 180 L180 180 Q194 180, 193 166 C190 120, 152 86, 120 76 Z"
          fill="url(#corpo)"/>
    <path d="M120 76 C96 84, 66 110, 60 140" fill="none" stroke="#E1ADB1" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- DIAS DE MODA -->
  <text x="400" y="478" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif" font-weight="700"
        font-size="130" letter-spacing="10" fill="#2B1A22">DIAS DE MODA</text>

  <!-- UNIFORMES -->
  <text x="400" y="556" text-anchor="middle"
        font-family="'Karla', sans-serif" font-weight="700"
        font-size="34" letter-spacing="18" fill="#AE567C">UNIFORMES</text>

  <!-- linha costurada -->
  <line x1="310" y1="604" x2="490" y2="604" stroke="#AE567C" stroke-width="5"
        stroke-dasharray="14 16" stroke-linecap="round"/>
