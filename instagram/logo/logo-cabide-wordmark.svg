<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;family=Karla:wght@700&amp;display=swap');
    </style>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C26A8C"/>
      <stop offset="1" stop-color="#8C3F63"/>
    </linearGradient>
  </defs>

  <!-- cabide -->
  <g transform="translate(280 10) scale(1.9)">
    <path d="M120 16 C120 28 133 33 133 46 C133 56 120 60 120 68"
