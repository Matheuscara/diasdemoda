<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Karla:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body { width:1080px; height:1920px; display:flex; align-items:center; justify-content:center; }
  .circle {
    width: 760px; height: 760px; border-radius: 50%;
    background: #AE567C;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 30px 80px rgb(0 0 0 / 0.28);
  }
  .ring {
    position: absolute; inset: -30px; border-radius: 50%;
    border: 4px dashed #E1ADB1;
  }
  .word {
    font-family: 'Karla', sans-serif; font-weight: 700;
    font-size: 150px; letter-spacing: 12px; color: #fff;
    text-transform: uppercase; text-indent: 12px;
  }
</style>
</head>
<body>
  <div class="circle">
    <div class="ring"></div>
    <div class="word">Pedir</div>
  </div>
</body>
</html>
