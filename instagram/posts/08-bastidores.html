<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap');

  :root {
    --rosa: #AE567C; --rosa-escuro: #8C3F63; --rosa-claro: #E1ADB1;
    --ameixa: #2B1A22; --ameixa-suave: #5C4450; --branco: #FBF6F4; --superficie: #F6E6EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: var(--branco);
    font-family: 'Karla', 'Helvetica Neue', sans-serif; color: var(--ameixa);
    overflow: hidden; position: relative; }
  /* textura de tecido (listras diagonais sutis) */
  body::before { content: ""; position: absolute; inset: 0; z-index: 0; opacity: 0.5;
    background-image:
      repeating-linear-gradient(45deg, rgb(174 86 124 / 0.05) 0 2px, transparent 2px 16px),
      repeating-linear-gradient(-45deg, rgb(174 86 124 / 0.05) 0 2px, transparent 2px 16px); }
  .orb { position: absolute; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, rgb(225 173 177 / 0.45) 0%, rgb(225 173 177 / 0) 70%); }
  .orb-a { width: 640px; height: 640px; top: -260px; right: -180px; }

  .frame { position: relative; z-index: 1; height: 100%; padding: 84px 88px;
    display: flex; flex-direction: column; }
  .label { font-family: 'Karla', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 6px; text-transform: uppercase; color: var(--rosa); }
  .stitch { height: 4px; width: 100%; border-radius: 999px; margin-top: 14px;
    background-image: repeating-linear-gradient(90deg, var(--rosa) 0 7px, transparent 7px 16px); }

  .headline { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700;
    font-size: 88px; line-height: 1.0; color: var(--ameixa); margin-top: 50px; }
  .headline em { font-style: italic; font-weight: 500; color: var(--rosa-escuro); }

  .sub { font-size: 27px; font-weight: 500; color: var(--ameixa-suave); margin-top: 28px;
    line-height: 1.45; max-width: 760px; }

  .quote { margin-top: 48px; border-left: 4px solid var(--rosa); padding-left: 28px;
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500;
    font-size: 34px; color: var(--ameixa); line-height: 1.3; max-width: 760px; }

  .cta-row { margin-top: auto; display: flex; align-items: center; gap: 24px; }
  .pill { display: inline-flex; align-items: center; background: var(--rosa); color: #fff;
    font-weight: 700; font-size: 22px; padding: 22px 38px; border-radius: 999px;
    box-shadow: 0 14px 34px rgb(174 86 124 / 0.32); }
  .phone { font-size: 19px; color: var(--ameixa-suave); }
</style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="frame">
    <div>
      <div class="label">Bastidores</div>
      <div class="stitch"></div>
    </div>
    <div class="headline">Costurado à mão,<br>com <em>36 anos</em> de ofício.</div>
    <div class="sub">Cada uniforme passa por mãos que conhecem o ofício: corte, costura e acabamento feitos na nossa confecção, em Rio Verde.</div>
    <div class="quote">"Prazo combinado e qualidade conferida uma a uma."</div>
    <div class="cta-row">
      <div class="pill">Pedir orçamento no WhatsApp</div>
      <div class="phone">+55 64 9943-1610</div>
    </div>
  </div>
</body>
</html>
