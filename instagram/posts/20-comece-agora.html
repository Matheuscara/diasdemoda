<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap');
  :root { --rosa:#AE567C; --rosa-claro:#E1ADB1; --ameixa:#2B1A22; --ameixa-suave:#C9B8C0; --branco:#FBF6F4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--ameixa); font-family:'Karla','Helvetica Neue',sans-serif; color:var(--branco); overflow:hidden; position:relative; }
  .orb { position:absolute; border-radius:50%; z-index:0; background:radial-gradient(circle, rgb(174 86 124 / 0.36) 0%, rgb(174 86 124 / 0) 70%); }
  .orb-a { width:760px; height:760px; top:-300px; right:-220px; }
  .orb-b { width:560px; height:560px; bottom:-240px; left:-160px; }
  .frame { position:relative; z-index:1; height:100%; padding:84px 88px; display:flex; flex-direction:column; justify-content:center; }
  .label { font-family:'Karla',sans-serif; font-weight:700; font-size:15px; letter-spacing:6px; text-transform:uppercase; color:var(--rosa-claro); }
  .stitch { height:4px; width:100%; border-radius:999px; margin-top:14px; background-image:repeating-linear-gradient(90deg, var(--rosa-claro) 0 7px, transparent 7px 16px); }
  .headline { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:82px; line-height:1.02; color:var(--branco); margin-top:56px; }
  .sub { font-size:27px; font-weight:500; color:var(--ameixa-suave); margin-top:28px; line-height:1.45; max-width:780px; }
  .cta { margin-top:54px; display:inline-flex; align-items:center; background:var(--rosa); color:#fff; font-weight:700; font-size:26px; padding:28px 48px; border-radius:999px; box-shadow:0 16px 40px rgb(174 86 124 / 0.4); }
  .phone { margin-top:24px; font-size:21px; color:var(--ameixa-suave); }
</style>
</head>
<body>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <div class="frame">
    <div><div class="label">Comece agora</div><div class="stitch"></div></div>
    <div class="headline">Sua equipe vestindo a sua<br>marca começa com uma mensagem.</div>
    <div class="sub">Envie a sua logo pelo WhatsApp e receba o orçamento no mesmo dia. O resto a gente resolve juntos.</div>
    <div class="cta">Enviar logo agora</div>
    <div class="phone">+55 64 9943-1610</div>
  </div>
</body>
</html>
