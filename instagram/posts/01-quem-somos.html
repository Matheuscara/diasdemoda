<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap');

  :root {
    --rosa: #AE567C;
    --rosa-escuro: #8C3F63;
    --rosa-claro: #E1ADB1;
    --ameixa: #2B1A22;
    --ameixa-suave: #5C4450;
    --branco: #FBF6F4;
    --superficie: #F6E6EA;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background: var(--branco);
    font-family: 'Karla', 'Helvetica Neue', sans-serif;
    color: var(--ameixa);
    overflow: hidden;
    position: relative;
  }

  /* círculos de fundo (parallax rosa) */
  .orb {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgb(225 173 177 / 0.55) 0%, rgb(225 173 177 / 0) 70%);
    z-index: 0;
  }
  .orb-a { width: 720px; height: 720px; top: -300px; right: -220px; }
  .orb-b { width: 560px; height: 560px; bottom: -240px; left: -180px; }

  .frame {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 84px 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* rótulo de seção */
  .label {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--rosa);
  }

  .stitch {
    height: 4px;
    width: 100%;
    border-radius: 999px;
    background-image: repeating-linear-gradient(90deg, var(--rosa) 0 7px, transparent 7px 16px);
    margin-top: 14px;
  }

  /* marca em texto (sem vetor do logo) */
  .logo-top {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.06em;
    color: var(--ameixa);
    line-height: 1;
  }
  .logo-sub {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--rosa);
    margin-top: 8px;
  }

  .content { max-width: 840px; }

  .headline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 118px;
    line-height: 0.98;
    color: var(--ameixa);
    letter-spacing: 0.005em;
  }
  .headline em {
    font-style: italic;
    font-weight: 500;
    color: var(--rosa-escuro);
  }

  .sub {
    font-size: 30px;
    font-weight: 500;
    color: var(--ameixa-suave);
    margin-top: 26px;
    line-height: 1.35;
    max-width: 680px;
  }

  .meta {
    margin-top: 30px;
    font-size: 20px;
    color: var(--ameixa-suave);
    line-height: 1.6;
  }
  .meta strong { color: var(--ameixa); font-weight: 700; }

  .cta-row {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--rosa);
    color: #fff;
    font-weight: 700;
    font-size: 22px;
    padding: 22px 38px;
    border-radius: 999px;
    box-shadow: 0 14px 34px rgb(174 86 124 / 0.32);
  }
  .phone {
    font-size: 19px;
    color: var(--ameixa-suave);
  }
</style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="frame">
    <div>
      <div class="label">Quem somos</div>
      <div class="stitch"></div>
    </div>

    <div class="content">
      <div class="logo">
        <div class="logo-top">DIAS DE MODA</div>
        <div class="logo-sub">Uniformes</div>
      </div>

      <div class="headline" style="margin-top: 46px;">
        <em>36 anos</em><br>de costura
      </div>

      <div class="sub">
        Uniformes que vestem a sua marca com elegância.
      </div>

      <div class="meta">
        <strong>Confecção própria em Rio Verde · GO.</strong><br>
        Enviamos para todo o Goiás.
      </div>
    </div>

    <div class="cta-row">
      <div class="pill">Pedir orçamento no WhatsApp</div>
      <div class="phone">+55 64 9943-1610</div>
    </div>
  </div>
</body>
</html>
