<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap');
  :root { --rosa:#AE567C; --rosa-claro:#E1ADB1; --ameixa:#2B1A22; --ameixa-suave:#C9B8C0; --branco:#FBF6F4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:var(--ameixa); font-family:'Karla','Helvetica Neue',sans-serif; color:var(--branco); overflow:hidden; position:relative; }
  .orb { position:absolute; border-radius:50%; z-index:0; background:radial-gradient(circle, rgb(174 86 124 / 0.34) 0%, rgb(174 86 124 / 0) 70%); }
  .orb-a { width:720px; height:720px; top:-280px; right:-200px; }
  .orb-b { width:560px; height:560px; bottom:-240px; left:-160px; }
  .frame { position:relative; z-index:1; height:100%; padding:84px 88px; display:flex; flex-direction:column; }
  .label { font-family:'Karla',sans-serif; font-weight:700; font-size:15px; letter-spacing:6px; text-transform:uppercase; color:var(--rosa-claro); }
  .stitch { height:4px; width:100%; border-radius:999px; margin-top:14px; background-image:repeating-linear-gradient(90deg, var(--rosa-claro) 0 7px, transparent 7px 16px); }
  .stat { margin-top:56px; display:flex; align-items:baseline; gap:18px; }
  .stat-num { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:170px; line-height:0.8; color:var(--rosa); }
  .stat-label { font-size:32px; font-weight:700; color:var(--branco); line-height:1.15; }
  .quote { margin-top:40px; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:500; font-size:48px; line-height:1.2; color:var(--branco); max-width:820px; }
  .author { margin-top:26px; font-size:22px; font-weight:700; color:var(--rosa-claro); }
  .cta-row { margin-top:auto; display:flex; align-items:center; gap:24px; }
  .pill { display:inline-flex; align-items:center; background:var(--rosa); color:#fff; font-weight:700; font-size:22px; padding:22px 38px; border-radius:999px; }
  .phone { font-size:19px; color:var(--ameixa-suave); }
</style>
</head>
<body>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <div class="frame">
    <div><div class="label">Resultado real</div><div class="stitch"></div></div>
    <div class="stat">
      <div class="stat-num">30</div>
      <div class="stat-label">uniformes<br>entregues</div>
    </div>
    <div class="quote">"A equipe ficou uniformizada do jeito que a gente imaginou, e tudo chegou no prazo combinado."</div>
    <div class="author">Cliente do setor de serviços · Goiânia</div>
    <div class="cta-row">
      <div class="pill">Quero um resultado assim</div>
      <div class="phone">+55 64 9943-1610</div>
    </div>
  </div>
</body>
</html>
