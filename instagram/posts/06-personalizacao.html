<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap');

  :root {
    --rosa: #AE567C; --rosa-escuro: #8C3F63; --rosa-claro: #E1ADB1;
    --ameixa: #2B1A22; --ameixa-suave: #5C4450; --branco: #FBF6F4; --superficie: #F6E6EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; background: var(--branco);
    font-family: 'Karla', 'Helvetica Neue', sans-serif; color: var(--ameixa);
    overflow: hidden; position: relative; }
  .orb { position: absolute; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, rgb(225 173 177 / 0.5) 0%, rgb(225 173 177 / 0) 70%); }
  .orb-a { width: 700px; height: 700px; top: -280px; right: -200px; }
  .orb-b { width: 540px; height: 540px; bottom: -220px; left: -160px; }

  .frame { position: relative; z-index: 1; height: 100%; padding: 84px 88px;
    display: flex; flex-direction: column; }
  .label { font-family: 'Karla', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 6px; text-transform: uppercase; color: var(--rosa); }
  .stitch { height: 4px; width: 100%; border-radius: 999px; margin-top: 14px;
    background-image: repeating-linear-gradient(90deg, var(--rosa) 0 7px, transparent 7px 16px); }

  .headline { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700;
    font-size: 86px; line-height: 1.02; color: var(--ameixa); margin-top: 46px; }
  .sub { font-size: 26px; font-weight: 500; color: var(--ameixa-suave); margin-top: 22px;
    line-height: 1.4; max-width: 720px; }

  .duo { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { border-radius: 20px; padding: 38px 30px; }
  .card-a { background: var(--superficie); }
  .card-b { background: var(--ameixa); color: var(--branco); }
  .card-tag { font-family: 'Karla', sans-serif; font-weight: 700; font-size: 14px;
    letter-spacing: 4px; text-transform: uppercase; }
  .card-a .card-tag { color: var(--rosa-escuro); }
  .card-b .card-tag { color: var(--rosa-claro); }
  .card-title { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700;
    font-size: 44px; margin-top: 14px; line-height: 1.05; }
  .card-sub { font-size: 19px; margin-top: 12px; line-height: 1.45; }
  .card-a .card-sub { color: var(--ameixa-suave); }
  .card-b .card-sub { color: #C9B8C0; }

  .cta-row { margin-top: auto; display: flex; align-items: center; gap: 24px; }
  .pill { display: inline-flex; align-items: center; background: var(--rosa); color: #fff;
    font-weight: 700; font-size: 22px; padding: 22px 38px; border-radius: 999px;
    box-shadow: 0 14px 34px rgb(174 86 124 / 0.32); }
  .phone { font-size: 19px; color: var(--ameixa-suave); }
</style>
</head>
<body>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <div class="frame">
    <div>
      <div class="label">Personalização</div>
      <div class="stitch"></div>
    </div>
    <div class="headline">Bordado ou estampa?</div>
    <div class="sub">A sua logo aplicada do jeito certo em cada peça.</div>
    <div class="duo">
      <div class="card card-a">
        <div class="card-tag">Bordado</div>
        <div class="card-title">Textura e<br>durabilidade</div>
        <div class="card-sub">Ideal para logos em polos e camisas de alto padrão.</div>
      </div>
      <div class="card card-b">
        <div class="card-tag">Estampa</div>
        <div class="card-title">Cor e<br>detalhe</div>
        <div class="card-sub">Perfeita para artes coloridas e peças em quantidade.</div>
      </div>
    </div>
    <div class="cta-row">
      <div class="pill">Pedir orçamento no WhatsApp</div>
      <div class="phone">+55 64 9943-1610</div>
    </div>
  </div>
</body>
</html>
