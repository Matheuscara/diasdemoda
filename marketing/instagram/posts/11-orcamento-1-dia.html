<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;700&display=swap');
  :root { --rosa:#AE567C; --rosa-escuro:#8C3F63; --rosa-claro:#E1ADB1; --ameixa:#2B1A22; --ameixa-suave:#5C4450; --branco:#FBF6F4; --superficie:#F6E6EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:var(--branco); font-family:'Karla','Helvetica Neue',sans-serif; color:var(--ameixa); overflow:hidden; position:relative; }
  .orb { position:absolute; border-radius:50%; z-index:0; background:radial-gradient(circle, rgb(225 173 177 / 0.5) 0%, rgb(225 173 177 / 0) 70%); }
  .orb-a { width:720px; height:720px; top:-280px; right:-200px; }
  .orb-b { width:540px; height:540px; bottom:-220px; left:-160px; }
  .frame { position:relative; z-index:1; height:100%; padding:84px 88px; display:flex; flex-direction:column; }
  .label { font-family:'Karla',sans-serif; font-weight:700; font-size:15px; letter-spacing:6px; text-transform:uppercase; color:var(--rosa); }
  .stitch { height:4px; width:100%; border-radius:999px; margin-top:14px; background-image:repeating-linear-gradient(90deg, var(--rosa) 0 7px, transparent 7px 16px); }
  .headline { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:76px; line-height:1.04; color:var(--ameixa); margin-top:48px; }
  .big { margin-top:40px; display:flex; align-items:baseline; gap:20px; }
  .big-num { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:200px; line-height:0.8; color:var(--rosa); }
  .big-label { font-size:34px; font-weight:700; color:var(--ameixa); line-height:1.15; }
  .sub { font-size:25px; font-weight:500; color:var(--ameixa-suave); margin-top:30px; line-height:1.4; max-width:740px; }
  .cta-row { margin-top:auto; display:flex; align-items:center; gap:24px; }
  .pill { display:inline-flex; align-items:center; background:var(--rosa); color:#fff; font-weight:700; font-size:22px; padding:22px 38px; border-radius:999px; box-shadow:0 14px 34px rgb(174 86 124 / 0.32); }
  .phone { font-size:19px; color:var(--ameixa-suave); }
</style>
</head>
<body>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <div class="frame">
    <div><div class="label">Vantagem</div><div class="stitch"></div></div>
    <div class="headline">Envie a sua logo hoje.<br>Receba o orçamento hoje.</div>
    <div class="big">
      <div class="big-num">1</div>
      <div class="big-label">dia para<br>responder</div>
    </div>
    <div class="sub">Sem espera, sem enrolação. Você manda a arte e a Alessandra responde com valor e prazo no mesmo dia.</div>
    <div class="cta-row">
      <div class="pill">Enviar logo e pedir orçamento</div>
      <div class="phone">+55 64 9943-1610</div>
    </div>
  </div>
</body>
</html>
